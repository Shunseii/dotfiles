id = "shunsei.goto"
name = "Goto Picker"
version = "0.1.0"
min_herdr_version = "0.9.2"
description = "Recent-first pane picker with agent/shell filter, grouping toggle, and session rename"
platforms = ["linux", "macos"]

# Opens the picker popup. Bound in config.toml via [[keys.command]].
[[actions]]
id = "open"
title = "Open goto picker"
contexts = ["global"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin shunsei.goto --entrypoint picker"]

[[panes]]
id = "picker"
title = "Goto"
placement = "popup"
width = "80%"
height = "70%"
command = ["python3", "picker.py"]

# Focus history for recent-first ordering. Written to HERDR_PLUGIN_STATE_DIR.
[[events]]
on = "pane.focused"
command = ["python3", "record.py"]

[[events]]
on = "tab.focused"
command = ["python3", "record.py"]
