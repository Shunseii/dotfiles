onboarding = false
# Herdr config — reference: https://herdr.dev/docs/config-reference/
# Reload after edits: `herdr server reload-config` or prefix+shift+r.

[theme]
name = "nord"

# overlay drives BOTH the headers/separators AND the non-focus pane border.
# Keep it a mid tone: brighter than stock nord (so separators/headers read),
# but dimmer than the focused border's frost, so focus still stands out with
# its original nord color (accent left at nord default — the look you liked).
[theme.custom]
surface_dim = "#4c566a" # nord3 — navigator separator + sidebar list bg
# overlay0/1 = muted secondary role: headers, non-focus pane borders, agent
# provider label, non-focus tab text. Lift to nord4/5 for readable text; the
# non-focus border stays distinct from the focused frost border by hue.
overlay0 = "#d8dee9"    # nord4
overlay1 = "#e5e9f0"    # nord5

[ui]
pane_borders = true

agent_panel_sort = "spaces"

# herdr-auto-title names new tabs, so skip the name prompt.
prompt_new_tab_name = false

[keys]
# tmux muscle memory: prefix was C-space, not the herdr default ctrl+b.
prefix = "ctrl+space"

# tmux had `M-H`/`M-L` (alt+shift) for prev/next window. Keep prefix binds too.
previous_tab = ["prefix+p", "alt+shift+h"]
next_tab = ["prefix+n", "alt+shift+l"]

# Vim-style workspace nav. Overrides the default prefix+j/k pane-focus, which
# is redundant here — panes are navigated with ctrl+h/j/k/l (vim plugin).
# Direct alt+j/k chords added so cycling doesn't need prefix re-pressed each
# step; prefix+j/k kept for muscle memory. (prefix+w opens navigate mode too.)
next_workspace = ["prefix+j", "alt+j"]
previous_workspace = ["prefix+k", "alt+k"]

# Cycle agents in the sidebar prefix-free. Agents aren't part of navigate mode,
# so direct chords are the only prefix-free option. alt+shift+j/k mirrors the
# alt+shift+h/l tab chords above (vertical=agents, horizontal=tabs).
next_agent = "alt+shift+j"
previous_agent = "alt+shift+k"

# Jump to workspace N: ctrl+space then shift+1..9.
switch_workspace = "prefix+shift+1..9"

# Jump to agent N in the sidebar: ctrl+space then alt+1..9.
focus_agent = "prefix+alt+1..9"

# Built-in Go To moved off prefix+g; the goto-picker plugin owns prefix+g.
goto = "prefix+shift+g"

# Navigate mode: use hjkl instead of arrows. j/k move between workspaces
# (the vertical sidebar list), h/l between panes left/right. Pane up/down
# moves to the arrows that workspaces vacated, so nothing double-binds.
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_left = "h"
navigate_pane_right = "l"
navigate_pane_down = "down"
navigate_pane_up = "up"

# tmux split keys: `"` splits down (horizontal), `%` splits right (vertical).
# Herdr default minus/v kept as safe fallback in case the punctuation names
# don't parse on this terminal.
split_horizontal = ["prefix+minus", "prefix+quote"]
split_vertical = ["prefix+v", "prefix+percent"]

# vim-herdr-navigation: seamless ctrl+h/j/k/l across Vim splits and herdr panes.
# Requires the plugin linked: `herdr plugin link ~/.config/herdr/plugins/vim-herdr-navigation`
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# goto-picker plugin (~/.config/herdr/plugins/goto-picker): recent-first pane
# picker with agent/shell filter (tab), grouping toggle (g), and rename (r).
[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "shunsei.goto.open"
description = "goto picker (recent first)"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-tsk.open-board"
description = "tsk board (split beside current pane)"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-tsk.quick-capture"
description = "tsk quick capture (new task popup)"

[ui.sound]
enabled = false

[ui.toast]
delivery = "off"
